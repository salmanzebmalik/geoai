[project]
name = "geoai"
version = "0.1.0"
description = "Environment for GeoAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.8.5",
    "fastapi>=0.136.1",
    "folium>=0.20.0",
    "geopandas>=1.1.3",
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.7",
    "lang-sam",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.29",
    "rasterio>=1.3.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "transformers>=5.7.0",
    "ultralytics>=8.4.46",
    "uvicorn>=0.47.0",
]

[tool.uv.sources]
lang-sam = { git = "https://github.com/luca-medeiros/lang-segment-anything.git" }

torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true